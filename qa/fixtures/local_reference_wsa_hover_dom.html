<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BRIM WSA mounted-tooltip regression fixture</title>
  <link rel="stylesheet" href="../../05_map_build/dev_sandbox/delta_ops_sandbox/docs/data/delta_ops_snapshot_preview_v2_files/leaflet-1.3.1/leaflet.css">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    #fixture-status {
      position: fixed;
      z-index: 10000;
      right: 8px;
      bottom: 8px;
      max-width: calc(100vw - 16px);
      padding: 6px 8px;
      border-radius: 4px;
      background: rgba(255,255,255,.94);
      font: 12px/1.3 Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="map" aria-label="Mounted WSA tooltip test map"></div>
  <output id="fixture-status" aria-live="polite">Running mounted-tooltip checks…</output>
  <script src="../../05_map_build/dev_sandbox/delta_ops_sandbox/docs/data/delta_ops_snapshot_preview_v2_files/leaflet-1.3.1/leaflet.js"></script>
  <script src="../../03_functions/js/brim_local_reference_filter_engine.js"></script>
  <script>
  (async function() {
    'use strict';

    var results = {passed: false};
    var status = document.getElementById('fixture-status');
    var nextFrame = function() {
      return new Promise(function(resolve) {
        requestAnimationFrame(function() { requestAnimationFrame(resolve); });
      });
    };
    var waitFor = async function(predicate, attempts) {
      var remaining = attempts || 60;
      while (remaining > 0 && !predicate()) {
        await nextFrame();
        remaining -= 1;
      }
      return predicate();
    };
    var escapeHtml = function(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    };
    var hoverHtml = function(lines) {
      var classes = [
        'pt-wsa-hover-name',
        'pt-wsa-hover-status',
        'pt-wsa-hover-office'
      ];
      return '<div class="pt-wsa-hover-lines">' + lines.map(function(line, index) {
        return '<div class="pt-wsa-hover-line ' + classes[index] + '">' +
          escapeHtml(line) + '</div>';
      }).join('') + '</div>';
    };
    var inspectTooltip = function(expectedLines) {
      var tooltip = document.querySelector('.leaflet-tooltip.pt-wsa-hover-tooltip');
      if (!tooltip) throw new Error('Leaflet did not mount the WSA tooltip.');
      var rect = tooltip.getBoundingClientRect();
      var computed = getComputedStyle(tooltip);
      var lineNodes = tooltip.querySelectorAll('.pt-wsa-hover-line');
      return {
        line_count: lineNodes.length,
        expected_line_count: expectedLines,
        no_literal_br_text: !/<br\s*\/?\s*>|&lt;br/i.test(tooltip.textContent),
        no_br_markup: !/<br\s*\/?\s*>|&lt;br/i.test(tooltip.innerHTML),
        normal_white_space: computed.whiteSpace === 'normal',
        break_word_wrapping: computed.overflowWrap === 'break-word',
        normal_word_break: computed.wordBreak === 'normal',
        width: rect.width,
        height: rect.height,
        left: rect.left,
        right: rect.right,
        viewport_width: window.innerWidth,
        no_internal_horizontal_overflow: tooltip.scrollWidth <= tooltip.clientWidth + 1,
        inside_viewport: rect.left >= -1 && rect.right <= window.innerWidth + 1,
        noncollapsed_width: rect.width >= Math.min(220, window.innerWidth - 32) - 2,
        responsive_max_width: rect.width <= Math.min(320, window.innerWidth - 32) + 2,
        reasonable_height: rect.height >= 36 && rect.height <= 132
      };
    };
    var assertionsPass = function(value) {
      return Object.keys(value).every(function(key) {
        if (key === 'width' || key === 'height' || key === 'left' ||
            key === 'right' || key === 'viewport_width' ||
            key === 'expected_line_count') return true;
        if (key === 'line_count') return value.line_count === value.expected_line_count;
        return value[key] === true;
      });
    };

    try {
      var map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        dragging: false,
        scrollWheelZoom: false,
        doubleClickZoom: false,
        boxZoom: false,
        keyboard: false
      }).setView([0, 0], 7);
      var groupName = 'Wilderness Study Areas';
      var geometryKey = 'wsa:fixture:geometry:1';
      var longThreeLineHtml = hoverHtml([
        'Sawtooth Mountains C and Northern California Desert Foothills Wilderness Study Area',
        'FLPMA §603 · Recommended non-suitable · ~74.2 mi²',
        'BLM office: Eagle Lake / Applegate'
      ]);
      var twoLineHtml = hoverHtml([
        'Red Mountain Wilderness Study Area',
        'FLPMA not stated · Not stated'
      ]);
      var popupHtml = '<div class="pt-wsa-popup"><b>Sawtooth Mountains C Wilderness Study Area</b>' +
        '<div><b>GIS acreage:</b> 47,510.7 acres</div>' +
        '<div><b>Verified responsible office:</b> Eagle Lake Field Office / Applegate Field Office</div>' +
        '<div><b>Management role:</b> Local land manager</div></div>';
      var polygon = L.rectangle([[-1, -1], [1, 1]], {
        layerId: geometryKey,
        color: '#A14E38',
        weight: 2,
        fillColor: '#D58A70',
        fillOpacity: 0.2
      });
      polygon.bindTooltip(longThreeLineHtml, {
        direction: 'top',
        opacity: 0.9,
        className: 'pt-wsa-hover-tooltip',
        sticky: false
      });
      polygon.bindPopup(popupHtml, {autoPan: false});
      var groupRoot = L.layerGroup([polygon]).addTo(map);
      map.layerManager = {
        _byGroup: {},
        _groupContainers: {}
      };
      map.layerManager._byGroup[groupName] = {fixture: polygon};
      map.layerManager._groupContainers[groupName] = groupRoot;

      var controllerSource = await fetch(
        '../../03_functions/js/brim_local_reference_controller.js'
      ).then(function(response) {
        if (!response.ok) throw new Error('Could not load the production Local Reference controller.');
        return response.text();
      });
      var installController = (0, eval)('(' + controllerSource + ')');
      installController.call(map, document.getElementById('map'), {}, [{
        layer_id: 'wilderness_study_areas',
        display_name: 'Wilderness Study Areas',
        group_name: groupName,
        auto_supported: true,
        auto_default: true,
        primary_count_mode: 'semantic_feature',
        primary_count_label: 'Wilderness Study Areas',
        show_component_count: false,
        component_count_label: 'mapped polygon components',
        caution: 'Fixture caution.',
        categories: [{
          category_key: 'non_suitable',
          label: 'Recommended non-suitable',
          fill_color: '#D58A70',
          stroke_color: '#A14E38',
          fill_opacity: 0.2,
          stroke_weight: 1.5,
          dash_array: '',
          legend_swatch_style: 'polygon'
        }],
        records: [{
          geometry_key: geometryKey,
          feature_key: 'wsa:fixture',
          semantic_feature_key: 'wsa:fixture',
          category_key: 'non_suitable',
          search_text: 'sawtooth mountains',
          geometry_component_count: 1
        }]
      }]);

      var centerBefore = map.getCenter();
      var zoomBefore = map.getZoom();
      var sizeBefore = map.getSize();
      polygon.openTooltip();
      await nextFrame();
      var threeLine = inspectTooltip(3);
      var centerAfterTooltip = map.getCenter();
      var sizeAfterTooltip = map.getSize();
      var tooltipDoesNotMoveMap = centerBefore.equals(centerAfterTooltip) &&
        zoomBefore === map.getZoom() &&
        sizeBefore.equals(sizeAfterTooltip);

      polygon.setTooltipContent(twoLineHtml);
      await nextFrame();
      var twoLine = inspectTooltip(2);

      var attackHtml = hoverHtml([
        '<img src=x onerror=alert(1)> Wilderness Study Area',
        'FLPMA §603 · Recommended suitable · ~0.00156 mi²'
      ]);
      polygon.setTooltipContent(attackHtml);
      await nextFrame();
      var attackTooltip = document.querySelector('.leaflet-tooltip.pt-wsa-hover-tooltip');
      var sourceValuesCannotInjectHtml = !attackTooltip.querySelector('img,script') &&
        attackTooltip.textContent.indexOf('<img src=x onerror=alert(1)>') >= 0;

      polygon.setTooltipContent(longThreeLineHtml);
      await nextFrame();
      var centerBeforePopup = map.getCenter();
      var zoomBeforePopup = map.getZoom();
      polygon.openPopup();
      await nextFrame();
      var popupDoesNotMoveMap = centerBeforePopup.equals(map.getCenter()) &&
        zoomBeforePopup === map.getZoom();
      var popup = document.querySelector('.leaflet-popup');
      var popupKeepsFullOfficeNames = !!popup && popup.textContent.indexOf(
        'Eagle Lake Field Office / Applegate Field Office'
      ) >= 0;
      var popupKeepsNativeGisAcres = !!popup && popup.textContent.indexOf(
        'GIS acreage: 47,510.7 acres'
      ) >= 0;
      var hoverUsesCompactSquareMiles = threeLine.line_count === 3 &&
        !/GIS area|GIS acre/i.test(longThreeLineHtml) &&
        longThreeLineHtml.indexOf('~74.2 mi²') >= 0;
      var zeroHoverOmitsArea = !/GIS area|GIS acre|mi²/i.test(twoLineHtml);
      var popupClosedHover = await waitFor(function() {
        return !document.querySelector('.leaflet-tooltip.pt-wsa-hover-tooltip');
      });

      var controllerStyle = document.getElementById('pt-local-reference-controller-css');
      var coarsePointerRule = !!controllerStyle &&
        controllerStyle.textContent.indexOf('@media (pointer:coarse){.leaflet-tooltip.pt-wsa-hover-tooltip,.leaflet-tooltip.pt-trails-hover-tooltip{display:none!important}') >= 0;
      var coarseRuntimeSuppressed = !window.matchMedia('(pointer: coarse)').matches ||
        getComputedStyle(document.createElement('div')).display !== 'block';

      results = {
        passed: assertionsPass(threeLine) && assertionsPass(twoLine) &&
          sourceValuesCannotInjectHtml && popupKeepsFullOfficeNames &&
          popupKeepsNativeGisAcres && hoverUsesCompactSquareMiles &&
          zeroHoverOmitsArea && popupClosedHover && coarsePointerRule && coarseRuntimeSuppressed &&
          tooltipDoesNotMoveMap && popupDoesNotMoveMap,
        three_line_tooltip: threeLine,
        two_line_tooltip: twoLine,
        source_values_cannot_inject_html: sourceValuesCannotInjectHtml,
        popup_keeps_full_office_names: popupKeepsFullOfficeNames,
        popup_keeps_native_gis_acres: popupKeepsNativeGisAcres,
        hover_uses_compact_square_miles: hoverUsesCompactSquareMiles,
        zero_hover_omits_area: zeroHoverOmitsArea,
        popup_closes_hover: popupClosedHover,
        popup_does_not_move_map: popupDoesNotMoveMap,
        coarse_pointer_rule_present: coarsePointerRule,
        coarse_runtime_suppressed_if_applicable: coarseRuntimeSuppressed,
        map_center_zoom_and_size_unchanged: tooltipDoesNotMoveMap,
        runtime_pointer_coarse: window.matchMedia('(pointer: coarse)').matches
      };
      window.__PT_WSA_HOVER_DOM_RESULTS__ = results;
      status.setAttribute('data-results', JSON.stringify(results));
      status.textContent = results.passed ?
        'PASS: mounted WSA tooltip DOM checks' :
        'FAIL: mounted WSA tooltip DOM checks';
      status.style.color = results.passed ? '#1E6B45' : '#9A2E20';
      status.style.fontWeight = '700';
    } catch (error) {
      results = {passed: false, error: String(error && error.stack || error)};
      window.__PT_WSA_HOVER_DOM_RESULTS__ = results;
      status.setAttribute('data-results', JSON.stringify(results));
      status.textContent = 'FAIL: ' + results.error;
      status.style.color = '#9A2E20';
    }
  }());
  </script>
</body>
</html>
